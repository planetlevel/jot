# The configuration of this project. The Assistant page can set it up, and this file is the one place it lives.
app:
  packages:
    - com.acme
  entry:
    - javax.servlet.Servlet.service
    - jakarta.servlet.Servlet.service

sensors:
- name: http-route
  description: Identifies the route a request came in at
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    path: "#P0.getRequestURI()"
    method: "#P0.getMethod()"

- name: auth-user
  description: Identifies the user making a request, or Guest when no one is signed in
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    user: '#P0.getRemoteUser()==null ? "Guest" : #P0.getRemoteUser()'

- name: auth-role-check
  description: Identifies an authorization check and whether the current user has the role
  methods:
  - javax.servlet.ServletRequest.isUserInRole
  - jakarta.servlet.ServletRequest.isUserInRole
  captures:
    role: "#P0"
    allowed: "#RET"
    user: '#OBJ.getRemoteUser() == null ? "Guest" : #OBJ.getRemoteUser()'
  matchers:
    role:
      - "!null"
    allowed:
      - "!null"

- name: http-parameter-received
  description: Identifies the parameter names a request was sent with
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    name: "#P0.getParameterNames()"
  matchers:
    name:
      - "!null"

- name: http-parameter-read
  description: Identifies the parameter names the application reads
  methods:
  - javax.servlet.ServletRequest.getParameter
  - jakarta.servlet.ServletRequest.getParameter
  - javax.servlet.ServletRequest.getParameterValues
  - jakarta.servlet.ServletRequest.getParameterValues
  captures:
    name: "#P0"
  matchers:
    name:
      - "!null"

- name: http-redirect
  description: Identifies a redirect being sent
  methods:
  - javax.servlet.ServletResponse.sendRedirect
  - jakarta.servlet.ServletResponse.sendRedirect
  captures:
    url: "#P0"
  matchers:
    url:
      - "!null"

- name: http-forward
  description: Identifies a request being forwarded
  methods:
  - javax.servlet.ServletRequest.getRequestDispatcher
  - jakarta.servlet.ServletRequest.getRequestDispatcher
  - javax.servlet.ServletContext.getRequestDispatcher
  - jakarta.servlet.ServletContext.getRequestDispatcher
  captures:
    path: "#P0"
  matchers:
    path:
      - "!null"

- name: http-filter-registered
  description: Identifies a filter being added at run time
  methods:
  - javax.servlet.ServletContext.addFilter
  - jakarta.servlet.ServletContext.addFilter
  captures:
    urls: "#RET.getUrlPatternMappings()"
  matchers:
    urls:
      - "!null"

- name: http-servlet-registered
  description: Identifies a servlet being added at run time
  methods:
  - javax.servlet.ServletContext.addServlet
  - jakarta.servlet.ServletContext.addServlet
  captures:
    urls: "#RET.getMappings()"
  matchers:
    urls:
      - "!null"

- name: http-cache-header
  description: Identifies a cache header being set
  methods:
  - javax.servlet.ServletResponse.setHeader
  - jakarta.servlet.ServletResponse.setHeader
  captures:
    cache_control: '#P0.equalsIgnoreCase("Cache-Control")?#P1:null'
  matchers:
    cache_control:
      - "!null"

- name: http-cookie-set
  description: Identifies a cookie being set and whether it is Secure and HttpOnly
  methods:
  - javax.servlet.http.HttpServletResponse.addCookie
  - jakarta.servlet.http.HttpServletResponse.addCookie
  captures:
    name: "#P0.getName()"
    secure: "#P0.getSecure()"
    http_only: "#P0.isHttpOnly()"

- name: http-security-header
  description: Identifies a security header being set and its value
  methods:
  - javax.servlet.ServletResponse.setHeader
  - jakarta.servlet.ServletResponse.setHeader
  - javax.servlet.ServletResponse.addHeader
  - jakarta.servlet.ServletResponse.addHeader
  captures:
    name: "#P0"
    value: "#P1"
  matchers:
    name:
      - (?i)^(Content-Security-Policy|Strict-Transport-Security|X-Frame-Options|X-Content-Type-Options|Referrer-Policy|Permissions-Policy|X-XSS-Protection|Cross-Origin-[\w-]+)$

- # Something sensitive in a request, found two ways that are kept apart, since they mean different things. A name that says password is
  # a field that probably holds one, and a value that is an SSN or a card number is the thing itself. The value sensors say which kind of
  # value it was, in kinds, one for each name and in the same order. Only names and kinds are recorded, never a value.
  # Each way is its own sensor because a list with nothing in it records nothing, so each stays quiet for a request it has nothing to report on.
  # A parameter is reported for a token too, by name or by value, since a token in a form field is worth knowing about. A cookie is not. A
  # session id, a csrf token and a login token are in a cookie on purpose, and the browser sends them with every request, so reporting them
  # would make every request an event. A cookie is reported for what it should never hold, a password, a secret, an SSN or a card number.
  name: http-parameter-sensitive-name
  description: Identifies a request parameter whose name says it holds something sensitive, such as a password, a secret, a token or an SSN
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    names: '#P0.parameterMap.keySet().?[#matches(#this, "(?i)password|passwd|token|secret|api[_-]?key|(^|[^a-z])ssn([^a-z]|$)|credit[_-]?card|(^|[^a-z])card([^a-z]|$)|card[_-]?(num|no)")]'

- name: http-parameter-sensitive-value
  description: Identifies a request parameter whose value looks sensitive, such as an SSN, a credit card number, a web token or a long token, and says which
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    names: '#P0.parameterMap.entrySet().?[#kind(value) != null].![key]'
    kinds: '#P0.parameterMap.entrySet().?[#kind(value) != null].![#kind(value)]'

- name: http-cookie-sensitive-name
  description: Identifies a request cookie whose name says it holds something it should not, such as a password, a secret, an SSN or a credit card number
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    names: '#list(#P0.cookies).?[#matches(name, "(?i)password|passwd|secret|(^|[^a-z])ssn([^a-z]|$)|credit[_-]?card|(^|[^a-z])card([^a-z]|$)|card[_-]?(num|no)")].![name]'

- name: http-cookie-sensitive-value
  description: Identifies a request cookie whose value is an SSN or a credit card number, and says which
  methods:
  - javax.servlet.Servlet.service
  - jakarta.servlet.Servlet.service
  captures:
    names: '#list(#P0.cookies).?[#kind(value) == "ssn" or #kind(value) == "card"].![name]'
    kinds: '#list(#P0.cookies).?[#kind(value) == "ssn" or #kind(value) == "card"].![#kind(value)]'

- name: sql-statement
  description: Identifies unparameterized database queries, the database they run against and the statement and connection settings they run with
  methods:
  - java.sql.Statement.execute
  - java.sql.Statement.addBatch
  - java.sql.Statement.executeQuery
  - java.sql.Statement.executeUpdate
  excludes:
  - java.sql.PreparedStatement   # these calls are harmless in PreparedStatement
  captures:
    sql: "#ARGS"
    command: "#toUpper(#P0.trim().split(' ')[0])"
    database: "#OBJ.getConnection().getMetaData().getDatabaseProductName()"
    url: "#OBJ.getConnection().getMetaData().getURL()"
    user: "#OBJ.getConnection().getMetaData().getUserName()"
    schema: "#OBJ.getConnection().getSchema()"
    auto_commit: "#OBJ.getConnection().getAutoCommit()"
    isolation: "#OBJ.getConnection().getTransactionIsolation()"
    read_only: "#OBJ.getConnection().isReadOnly()"
    query_timeout: "#OBJ.getQueryTimeout()"
    max_rows: "#OBJ.getMaxRows()"
    fetch_size: "#OBJ.getFetchSize()"

- name: sql-prepared
  description: Identifies parameterized database queries, the database they are for, how many parameters they take and how they can be read
  methods:
  - java.sql.Connection.prepareCall
  - java.sql.Connection.prepareStatement
  captures:
    sql: "#P0"
    command: "#toUpper(#P0.trim().split(' ')[0])"
    database: "#OBJ.getMetaData().getDatabaseProductName()"
    url: "#OBJ.getMetaData().getURL()"
    user: "#OBJ.getMetaData().getUserName()"
    schema: "#OBJ.getSchema()"
    auto_commit: "#OBJ.getAutoCommit()"
    isolation: "#OBJ.getTransactionIsolation()"
    read_only: "#OBJ.isReadOnly()"
    parameter_count: "#RET?.getParameterMetaData()?.getParameterCount()"
    result_set_type: "#RET?.getResultSetType()"
    result_set_concurrency: "#RET?.getResultSetConcurrency()"

- name: sql-connection
  description: Identifies a database connection being opened, the JDBC URL it connects to and the database and driver behind it
  methods:
  - java.sql.DriverManager.getConnection
  captures:
    url: "#P0"
    product: "#RET?.getMetaData()?.getDatabaseProductName()"
    version: "#RET?.getMetaData()?.getDatabaseProductVersion()"
    driver: "#RET?.getMetaData()?.getDriverName()"
    user: "#RET?.getMetaData()?.getUserName()"

- name: sql-update
  description: Identifies a database update being run and how many rows it changed
  methods:
  - java.sql.Statement.executeUpdate
  - java.sql.Statement.executeLargeUpdate
  captures:
    sql: "#P0"
    rows: "#RET"
    database: "#OBJ.getConnection().getMetaData().getDatabaseProductName()"
    auto_commit: "#OBJ.getConnection().getAutoCommit()"

- name: sql-result
  description: Identifies the shape of what a query returned, its columns, their types and the tables they came from
  methods:
  - java.sql.Statement.executeQuery
  captures:
    sql: "#P0"
    column_count: "#RET.getMetaData().getColumnCount()"
    columns: "{1,2,3,4,5,6,7,8}.?[#this <= #RET.getMetaData().getColumnCount()].![#RET.getMetaData().getColumnLabel(#this)]"
    types: "{1,2,3,4,5,6,7,8}.?[#this <= #RET.getMetaData().getColumnCount()].![#RET.getMetaData().getColumnTypeName(#this)]"
    tables: "{1,2,3,4,5,6,7,8}.?[#this <= #RET.getMetaData().getColumnCount()].![#RET.getMetaData().getTableName(#this)]"
    result_set_type: "#RET.getType()"
    fetch_size: "#RET.getFetchSize()"

- name: sql-metadata
  description: Identifies result set metadata being requested, with the number of columns and the table of the first column
  methods:
  - java.sql.ResultSet.getMetaData
  captures:
    column_count: "#RET?.getColumnCount()"
    first_table: "#RET?.getTableName(1)"
    first_column: "#RET?.getColumnName(1)"

- name: sql-schema-lookup
  description: Identifies the database schema being inspected for its tables, columns, keys or indexes, and the names it was asked about
  methods:
  - java.sql.DatabaseMetaData.getTables
  - java.sql.DatabaseMetaData.getColumns
  - java.sql.DatabaseMetaData.getPrimaryKeys
  - java.sql.DatabaseMetaData.getImportedKeys
  - java.sql.DatabaseMetaData.getExportedKeys
  - java.sql.DatabaseMetaData.getIndexInfo
  captures:
    args: "#ARGS"

- name: file-path
  description: Identifies file and directory use
  methods:
  - java.io.File.<init>
  captures:
    path: "#OBJ.getCanonicalPath()"
  # leaves out the JDK and servlet container files that are read all the time
  matchers:
    path:
      - "!/apache-tomcat"
      - "!/tomcat-base"
      - "!/openjdk"
      - "!/Cellar/"
      - "!/candidates/java/"

- name: net-socket
  description: Identifies a socket being opened
  methods:
  - java.net.Socket.<init>
  captures:
    host: "#P0"
    port: "#P1"
  matchers:
    host:
      - "!null"
    port:
      - "!^8080$"

- name: net-url
  description: Identifies the host and protocol of a URL being connected to
  methods:
  - java.net.URL.openConnection
  captures:
    host: "#OBJ.getHost()"
    protocol: "#OBJ.getProtocol()"
    port: "#OBJ.getPort() == -1 ? #OBJ.getDefaultPort() : #OBJ.getPort()"
  matchers:
    protocol:
      - (?i)^(https?|ftp)$

- name: object-class
  description: Identifies the classes an ObjectInputStream turns bytes into
  methods:
  - java.io.ObjectInputStream.resolveClass
  captures:
    class: "#P0.getName()"

- # A web request must never deserialize objects.
  name: object-deserialization
  description: Identifies deserializing an object
  methods:
  - java.io.ObjectInputStream.readObject
  - java.io.ObjectInputStream.readUnshared
  captures:
    args: "#ARGS"

- name: expression-el-create
  description: Identifies an expression language expression being created, and its text
  methods:
  - jakarta.el.ExpressionFactory.createValueExpression
  - javax.el.ExpressionFactory.createValueExpression
  - jakarta.el.ExpressionFactory.createMethodExpression
  - javax.el.ExpressionFactory.createMethodExpression
  captures:
    expression: "#P1.toString()"

- name: expression-el-evaluate
  description: Identifies an expression language expression being evaluated, and its text
  methods:
  - jakarta.el.ValueExpression.getValue
  - javax.el.ValueExpression.getValue
  - jakarta.el.ValueExpression.setValue
  - javax.el.ValueExpression.setValue
  - jakarta.el.MethodExpression.invoke
  - javax.el.MethodExpression.invoke
  captures:
    expression: "#OBJ.getExpressionString()"
    literal: "#OBJ.isLiteralText()"

- name: expression-spel
  description: Identifies a Spring expression being evaluated, which can run any code in the JVM when the text comes from outside
  methods:
  - org.springframework.expression.spel.standard.SpelExpression.getValue
  captures:
    expression: "#OBJ.expressionString"

- name: expression-lookup
  description: Identifies a ${...} lookup being resolved by commons-text or commons-configuration, and which lookup resolved it
  methods:
  - org.apache.commons.text.lookup.StringLookup.lookup
  - org.apache.commons.configuration.interpol.ConfigurationInterpolator.lookup
  captures:
    key: "#P0"
    lookup: "#OBJ.getClass().getName()"

- name: expression-lookup-log4j
  description: Identifies a ${...} lookup being resolved by log4j, such as jndi, env or sys, and which lookup resolved it
  methods:
  - org.apache.logging.log4j.core.lookup.StrLookup.lookup
  captures:
    key: "#list(#ARGS).?[#this.getClass().getName() == 'java.lang.String']"
    lookup: "#OBJ.getClass().getName()"

- # The microsandbox for expression injection. Evaluating an expression is allowed, but while one is being
  # evaluated it can't start a process or open a socket.
  name: expression
  description: Identifies an expression being evaluated starting a process or opening a socket
  methods:
  - java.lang.ProcessBuilder.<init>
  - java.net.Socket.<init>
  scopes:
  - javax.el.ValueExpression.getValue
  - jakarta.el.ValueExpression.getValue
  captures:
    expression: "#ARGS"
  block-when: true
  protect: false

- # The pattern based alternative, which looks for attack text in the expression itself. It is easier to get
  # around than the sandbox above. Add "protect: false" to stage it as report only, and the dashboard can then
  # promote it to block.
  name: expression-suspicious
  description: Identifies an expression that contains reflection or process APIs
  methods:
  - javax.el.ExpressionFactory.createValueExpression
  - jakarta.el.ExpressionFactory.createValueExpression
  captures:
    expression: "#P1"
  matchers:
    expression:
      - \.class
      - getRuntime
      - ProcessBuilder
      - forName
  block-when: true
  protect: false

- name: crypto-cipher
  description: Identifies a cipher being initialized, its algorithm, whether it encrypts or decrypts, and the algorithm and size in bits of its key
  methods:
  - javax.crypto.Cipher.init
  captures:
    algorithm: "#OBJ.getAlgorithm()"
    operation: '#P0 == 1 ? "encrypt" : #P0 == 2 ? "decrypt" : "other"'
    key_algorithm: "#P1.getAlgorithm()"
    bits: '#P1.getAlgorithm() == "RSA" ? #P1.getModulus().bitLength() : #P1.getEncoded().length * 8'

- name: crypto-cipher-request
  description: Identifies a cipher algorithm being requested, before it is used
  methods:
  - javax.crypto.Cipher.getInstance
  captures:
    algorithm: "#P0"

- name: crypto-hash
  description: Identifies a hash algorithm being used
  methods:
  - java.security.MessageDigest.getInstance
  captures:
    algorithm: "#P0"

- name: crypto-key-size
  description: Identifies the size of a key or key pair being generated
  methods:
  - java.security.KeyPairGenerator.initialize
  - javax.crypto.KeyGenerator.init
  captures:
    algorithm: "#OBJ.getAlgorithm()"
    bits: "#P0"
  matchers:
    algorithm:
      - ^[\w/-]+$

- name: crypto-key-spec
  description: Identifies the algorithm and length of a secret key built from bytes, the bytes themselves are not captured
  methods:
  - javax.crypto.spec.SecretKeySpec.<init>
  captures:
    algorithm: "#P1"
    bits: "#P0.length * 8"

- # A web request must never start an operating system process.
  name: native-process
  description: Identifies starting a native process
  methods:
  - java.lang.ProcessBuilder.<init>
  captures:
    command: "#ARGS"
  block-when: true
  protect: false

- # Native code loaded by a web request can do anything the JVM can. Libraries are loaded once, often on first use inside the
  # first request (a JDBC driver extracting its native part, for example), so run in monitor for a while, see what loads, then
  # move to protect.
  name: native-library
  description: Identifies loading a native library
  methods:
  - java.lang.System.load
  - java.lang.System.loadLibrary
  - java.lang.Runtime.load
  - java.lang.Runtime.loadLibrary
  captures:
    name: "#P0"
  matchers:
    name:
      - "!null"

- # The JVM must never be shut down by a web request.
  name: jvm-exit
  description: Identifies ending the JVM
  methods:
  - java.lang.Runtime.exit
  - java.lang.Runtime.halt
  captures:
    args: "#ARGS"
  block-when: true
  protect: false

- name: thread-runnable
  description: Identifies a thread being created with a Runnable and the code that created it
  methods:
  - java.lang.Thread.<init>
  captures:
    runnable_classes: "#ARGS.![#this?.getClass()?.getName()]"
    caller: "#CALLER"
  matchers:
    runnable_classes:
    - '!^java\.lang\.(String|ThreadGroup|Long|Boolean)$'

- name: ai-model-call
  description: Identifies a call to an AI model, with the provider, the model and the parameters it was given, how many tools it was offered and how many tokens it used
  methods:
  - org.springframework.ai.anthropic.AnthropicChatModel.internalCall
  - org.springframework.ai.openai.OpenAiChatModel.internalCall
  - org.springframework.ai.ollama.OllamaChatModel.internalCall
  scopes: []
  captures:
    provider: "#OBJ.getClass().getSimpleName().replace('ChatModel', '').toLowerCase()"
    model: "#P0.options?.model"
    temperature: "#P0.options?.temperature"
    max_tokens: "#P0.options?.maxTokens"
    top_p: "#P0.options?.topP"
    top_k: "#P0.options?.topK"
    tools: "#P0.options?.toolCallbacks?.size()"
    messages: "#P0.instructions.size()"
    input_tokens: "#RET?.metadata?.usage?.promptTokens"
    output_tokens: "#RET?.metadata?.usage?.completionTokens"
    finish_reason: "#RET?.result?.metadata?.finishReason"

- name: ai-tool-request
  description: Identifies the model asking for a tool to be run, with the name of the tool and the arguments the model chose
  methods:
  - org.springframework.ai.tool.method.MethodToolCallback.call
  scopes: []
  captures:
    tool: "#OBJ.toolDefinition.name()"
    arguments: "#P0"

- name: ai-tool-invoked
  description: Identifies a tool of the agent being run, with the tool's name, the class it is in and the arguments it was given
  methods:
  - "@org.springframework.ai.tool.annotation.Tool"
  captures:
    tool: "#ANNOTATION.name"
    class: "#OBJ.getClass().getSimpleName()"
    arguments: "#ARGS"

- name: regex-pattern
  description: Identifies a regular expression being compiled
  methods:
  - java.util.regex.Pattern.compile
  captures:
    pattern: "#P0"
    pattern_length: "#P0.length()"

# CVE-2019-12384 Deserialization of Untrusted Data in FasterXML jackson-databind
# com.fasterxml.jackson.core:jackson-databind >= 2.9.0, < 2.9.9.1
- name: cve-2019-12384
  description: Identifies an attack on CVE-2019-12384, when its vulnerable code does something an exploit needs, like starting a process or running a script
  methods:
  - javax.el.ExpressionFactory.createValueExpression
  - jakarta.el.ExpressionFactory.createValueExpression
  - javax.el.MethodExpression.invoke
  - jakarta.el.MethodExpression.invoke
  - javax.el.ValueExpression.getValue
  - jakarta.el.ValueExpression.getValue
  - ognl.Ognl.getValue
  - ognl.Ognl.setValue
  - org.springframework.expression.ExpressionParser.parseExpression
  - org.springframework.expression.spel.standard.SpelExpression.getValue
  - javax.naming.Context.lookup
  - javax.naming.InitialContext.lookup
  - javax.naming.directory.DirContext.search
  - java.lang.ProcessBuilder.start
  - java.lang.Runtime.exec
  - com.sun.tools.javac.Main.compile
  - groovy.lang.GroovyShell.evaluate
  - groovy.lang.GroovyShell.parse
  - javax.script.ScriptEngine.eval
  - javax.tools.JavaCompiler.getTask
  - javax.tools.JavaCompiler.run
  - javax.tools.ToolProvider.getSystemJavaCompiler
  - net.openhft.compiler.CompilerUtils.compile
  - org.codehaus.commons.compiler.ICompiler.compile
  - org.codehaus.janino.ScriptEvaluator.evaluate
  - org.codehaus.janino.SimpleCompiler.cook
  - org.mozilla.javascript.Context.evaluateString
  scopes:
  - com.fasterxml.jackson.databind.ser.DefaultSerializerProvider.serializeValue
  - com.fasterxml.jackson.databind.ObjectMapper.readValue
  captures:
    args: "#ARGS"
  block-when: true

# Edited by hand, the jndi methods are added to what vulnpoint says. Regenerating this file removes them.
# CVE-2021-44228 Remote code injection in Log4j
# org.apache.logging.log4j:log4j-core >= 2.13.0, < 2.15.0
- name: cve-2021-44228
  description: Identifies an attack on CVE-2021-44228, when its vulnerable code does something an exploit needs, like starting a process or running a script
  methods:
  - javax.el.ExpressionFactory.createValueExpression
  - jakarta.el.ExpressionFactory.createValueExpression
  - javax.el.MethodExpression.invoke
  - jakarta.el.MethodExpression.invoke
  - javax.el.ValueExpression.getValue
  - jakarta.el.ValueExpression.getValue
  - ognl.Ognl.getValue
  - ognl.Ognl.setValue
  - org.springframework.expression.ExpressionParser.parseExpression
  - org.springframework.expression.spel.standard.SpelExpression.getValue
  - java.lang.ProcessBuilder.start
  - java.lang.Runtime.exec
  - com.sun.tools.javac.Main.compile
  - groovy.lang.GroovyShell.evaluate
  - groovy.lang.GroovyShell.parse
  - javax.script.ScriptEngine.eval
  - javax.tools.JavaCompiler.getTask
  - javax.tools.JavaCompiler.run
  - javax.tools.ToolProvider.getSystemJavaCompiler
  - net.openhft.compiler.CompilerUtils.compile
  - org.codehaus.commons.compiler.ICompiler.compile
  - org.codehaus.janino.ScriptEvaluator.evaluate
  - org.codehaus.janino.SimpleCompiler.cook
  - org.mozilla.javascript.Context.evaluateString
  - javax.naming.Context.lookup
  - javax.naming.InitialContext.lookup
  - javax.naming.directory.DirContext.search
  scopes:
  - org.apache.logging.log4j.core.lookup.JndiLookup.lookup
  captures:
    args: "#ARGS"
  block-when: true

