<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOT Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #2457d6; --accent-text: #ffffff; --bar: #2457d6; --blocked: #c62828; --blocked-bg: #fdecec;
    --monitored: #a05a00; --monitored-bg: #fff4e0; --observed: #2e6b3d; --observed-bg: #e8f4ea;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --panel: #1b2027; --text: #e6e9ee; --muted: #98a2b3; --line: #2b323c;
      --accent: #6b95ff; --accent-text: #0d1117; --bar: #6b95ff; --blocked: #ff8a80; --blocked-bg: #3a1f1f;
      --monitored: #ffc078; --monitored-bg: #3a2e1a; --observed: #7ed08f; --observed-bg: #1d3023; --code: #232a33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151a; --panel: #1b2027; --text: #e6e9ee; --muted: #98a2b3; --line: #2b323c;
    --accent: #6b95ff; --accent-text: #0d1117; --bar: #6b95ff; --blocked: #ff8a80; --blocked-bg: #3a1f1f;
    --monitored: #ffc078; --monitored-bg: #3a2e1a; --observed: #7ed08f; --observed-bg: #1d3023; --code: #232a33;
  }
  * { box-sizing: border-box; }
  /* a page or card with hidden must really disappear, even when a rule gives it a display */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* top menu */
  header { display: flex; align-items: center; gap: 4px 24px; padding: 0 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; padding: 12px 0; }
  header nav { display: flex; gap: 4px; flex: 1; }
  header nav a { padding: 14px 14px 11px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted);
                 text-decoration: none; }
  header nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  header nav a:hover { color: var(--text); }
  #policyPill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; text-decoration: none; }
  #policyPill.block { background: var(--blocked-bg); color: var(--blocked); }
  #policyPill.partial { background: var(--monitored-bg); color: var(--monitored); }
  #policyPill.observe { background: var(--monitored-bg); color: var(--monitored); }

  .menu { position: relative; }
  #recentBtn { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 14px 10px 11px; border-radius: 0; }
  #recentBtn:hover, #recentBtn[aria-expanded="true"] { color: var(--text); }
  .menulist { position: absolute; right: 0; top: 100%; z-index: 20; width: 440px; max-width: 92vw; max-height: 60vh; overflow: auto;
              background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); padding: 6px; }
  .menulist button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menulist button:hover, .menulist button:focus { background: var(--code); outline: none; }
  .menulist .none { color: var(--muted); font-size: 13px; padding: 8px 10px; }
  .menulist .sep { border-top: 1px solid var(--line); margin: 6px 0; }
  .menulist .clear { color: var(--muted); font-size: 13px; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card + .card, .card + div, div + .card { margin-top: 16px; }
  .policy { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .policy.has-detail { grid-template-columns: minmax(0, 1fr) 440px; }
  .policy > .wide { grid-column: 1 / -1; }
  .policy > * + * { margin-top: 0; }
  @media (max-width: 960px) { .policy.has-detail { grid-template-columns: minmax(0, 1fr); } }

  form.ask { display: flex; gap: 8px; }
  input[type=text], input[type=password], textarea, select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=text], textarea { width: 100%; padding: 10px 12px; }
  input[type=text]:focus, input[type=password]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .notice { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--monitored-bg); color: var(--monitored); font-size: 13px; }
  .error { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--blocked-bg); color: var(--blocked); font-size: 14px; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  /* events page */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; justify-content: space-between; margin: 14px 2px 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--text); }
  .stats .blocked b { color: var(--blocked); }
  .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  button.small { padding: 4px 12px; font-size: 13px; }
  label.refresh { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .result h2 { margin: 0 0 2px; font-size: 17px; }
  .explain { color: var(--muted); margin: 0 0 12px; }
  /* no height limit, a table that scrolls inside the page hides its last rows, so the page itself scrolls. */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; border-bottom: 1px solid var(--line); padding: 6px 10px; white-space: nowrap; }
  td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 460px; overflow-wrap: anywhere; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.null { color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  table.grid th.col { text-align: center; }
  table.grid td.rowlabel { position: sticky; left: 0; background: var(--panel); font-weight: 600; border-right: 1px solid var(--line); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  table.grid td.on { text-align: center; background: var(--observed-bg); color: var(--observed); font-weight: 700; }
  table.grid td.vals { text-align: left; font-weight: 500; }
  table.grid td.vals ul { margin: 0; padding-left: 18px; }
  table.grid td.vals li { margin: 2px 0; }
  table.grid td.off { background: transparent; }
  .picker { margin-top: 10px; }
  .picker select { max-width: 100%; }
  .badge { white-space: nowrap; display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.4px; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; }
  .badge.blocked { background: var(--blocked-bg); color: var(--blocked); }
  .badge.monitored { background: var(--monitored-bg); color: var(--monitored); }
  .badge.observed, .badge.sensor { background: var(--observed-bg); color: var(--observed); }
  .badge.report { background: var(--code); color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; min-height: 120px; background: var(--code); margin-top: 8px; }
  svg text { fill: var(--text); font-size: 12px; }
  svg .muted { fill: var(--muted); }

  /* policy page */
  h2.section { margin: 0 0 2px; font-size: 17px; }
  .modebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 18px; background: var(--panel); font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active.observe { background: var(--monitored-bg); color: var(--monitored); }
  .seg button.active.block { background: var(--blocked-bg); color: var(--blocked); }
  .seg button:disabled { cursor: default; }
  .modehelp { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .modehelp b { color: var(--text); }
  .rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
  .rule:first-of-type { margin-top: 12px; }
  .rule .name { font-weight: 600; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .rule .why, .rule .counts { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .rule .sw { grid-row: 1 / span 3; grid-column: 2; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  button.switch { position: relative; width: 44px; height: 24px; padding: 0; border-radius: 999px; background: var(--line); border: 0; }
  button.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel);
                         box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: left 0.12s; }
  button.switch[aria-checked="true"] { background: var(--blocked); }
  button.switch[aria-checked="true"]::after { left: 23px; }
  .applied { color: var(--muted); font-size: 12px; margin-top: 8px; }
  /* the token field switches between password and text when Show is clicked, so give it a size of its own,
     otherwise the rule that makes text inputs full width pushes the button onto the next line */
  #tokenBox { display: inline-flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
  #tokenBox input { width: 240px; padding: 8px 10px; }
  #tokenBox button { padding: 8px 14px; }
  .jotbar { display: flex; gap: 8px; }
  .jotbar input { flex: 1; }
  table.list tbody tr { cursor: pointer; }
  table.list td:nth-child(4) { white-space: nowrap; }
  table.list tbody tr:hover td { background: var(--code); }
  table.list tbody tr.selected td { background: var(--observed-bg); }
  .issue { padding: 6px 10px; border-radius: 6px; margin-top: 6px; font-size: 13px; background: var(--monitored-bg); color: var(--monitored); overflow-wrap: anywhere; }
  .issue.info { background: var(--code); color: var(--muted); }
  #jotDetail { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; }
  #jotDetail .close { float: right; border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
  #jotDetail .close:hover { color: var(--text); }
  table.list td { overflow-wrap: normal; }
  table.list td:first-child { white-space: nowrap; }
  #jotDetail h2 { margin: 0 0 4px; font-size: 17px; overflow-wrap: anywhere; }
  #jotDetail h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  #jotDetail ul { margin: 0; padding-left: 18px; }
  #jotDetail li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  #jotDetail pre { margin: 0; padding: 10px; background: var(--code); border-radius: 8px; overflow: auto; font-size: 12px; max-height: 320px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .fact { background: var(--code); border-radius: 8px; padding: 6px 10px; }
  .fact b { display: block; font-size: 16px; }
  .fact span { color: var(--muted); font-size: 12px; }
  /* the event viewer, a panel that slides over the page */
  #eventBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
  #eventDrawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.35); z-index: 41; overflow-y: auto; padding: 16px 20px 32px; }
  #eventDrawer .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #eventDrawer .top .spacer { flex: 1; }
  #eventDrawer h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  #eventDrawer h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #eventDrawer .when { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #eventDrawer pre.value { margin: 0; padding: 10px 12px; background: var(--code); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 13px; max-height: 260px; overflow: auto; }
  #eventDrawer dl { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
  #eventDrawer dt { color: var(--muted); }
  #eventDrawer dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #eventDrawer .frames { margin: 0; padding: 0; list-style: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #eventDrawer .frames li { display: grid; grid-template-columns: 34px 1fr; padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  #eventDrawer .frames .n { color: var(--muted); text-align: right; padding-right: 10px; }
  #eventDrawer .frames .platform { color: var(--muted); }
  #eventDrawer .frames .library { }
  #eventDrawer .frames .app { background: var(--observed-bg); color: var(--observed); font-weight: 600; }
  #eventDrawer .opt { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-left: 10px; text-transform: none; letter-spacing: 0; }
  #eventDrawer table.rel { width: 100%; font-size: 12px; }
  #eventDrawer table.rel tr { cursor: pointer; }
  #eventDrawer table.rel tr:hover td { background: var(--code); }
  #eventDrawer table.rel tr.here td { background: var(--observed-bg); font-weight: 600; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--code); }
  tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<header>
  <h1>JOT</h1>
  <nav aria-label="Pages">
    <a href="#events" id="navEvents" class="active">Events</a>
    <a href="#policy" id="navPolicy">Policy</a>
  </nav>
  <div class="menu" id="recentMenu">
    <button type="button" id="recentBtn" aria-haspopup="true" aria-expanded="false">Recent questions &#9662;</button>
    <div class="menulist" id="recentList" role="menu" hidden></div>
  </div>
  <a href="#policy" id="policyPill" hidden></a>
</header>

<!-- ============ events ============ -->
<main id="eventsPage">
  <div class="card">
    <form class="ask" id="askForm">
      <input type="text" id="question" autocomplete="off" aria-label="Ask a question"
             placeholder="Ask about your application, like: which routes use weak ciphers?">
      <button class="primary" id="askBtn" type="submit">Ask</button>
    </form>
    <div class="row picker">
      <select id="reportSelect" aria-label="Views and reports"><option value="">Views and reports&hellip;</option></select>
    </div>
    <div id="notice"></div>
  </div>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="toolbar-right">
      <button type="button" class="small" id="clearBtn" title="Hide everything recorded so far, so the page only shows what happens from now on. The events stay in the log, and Show all brings them back.">Clear</button>
      <button type="button" class="small" id="showAllBtn" title="Show everything again, including what was hidden by Clear" hidden>Show all</button>
      <label class="refresh" title="Leave out what the JDK and the application server do on their own. An event stays if any frame of its stack is the application, even when libraries are in between. Blocked and reported events always show.">
        <input type="checkbox" id="appOnly"> App events only
      </label>
      <label class="refresh" title="Run the current view again every 3 seconds, so new events show up on their own">
        <input type="checkbox" id="live"> Refresh every 3 seconds
      </label>
    </div>
  </div>
  <div id="results" style="margin-top:10px"></div>
</main>

<!-- ============ policy ============ -->
<main id="policyPage" hidden>
  <div class="policy" id="policyGrid">
    <div class="card wide" id="enforcementCard">
      <h2 class="section">Enforcement</h2>
      <div class="hint" id="enforceStatus" style="margin-top:2px"></div>
      <div class="modebar">
        <div class="seg" role="group" aria-label="Enforcement mode">
          <button type="button" id="modeObserve">Observe</button>
          <button type="button" id="modeBlock">Block</button>
        </div>
        <span id="tokenBox" hidden>
          <input type="password" id="adminToken" name="jot-admin-token" autocomplete="new-password" spellcheck="false"
                 data-1p-ignore data-lpignore="true" placeholder="Admin token" aria-label="Admin token">
          <button type="button" id="tokenShow" title="Show what you typed, to check it">Show</button>
        </span>
      </div>
      <p class="modehelp"><b>Observe</b> rules report what they would stop, and stop nothing.
        <b>Block</b> rules stop the calls they are written to stop. Sensors that aren't rules only ever observe.</p>
      <div id="controlBody"></div>
    </div>

    <div class="card" id="definitions">
      <h2 class="section">Sensors, rules and reports</h2>
      <div class="jotbar" style="margin-top:8px">
        <input type="text" id="jotFilter" autocomplete="off" aria-label="Filter" placeholder="Filter by name, method, file or description">
        <select id="jotKind" aria-label="Show">
          <option value="">Everything</option><option value="sensor">Sensors</option>
          <option value="rule">Rules</option><option value="report">Reports</option>
        </select>
      </div>
      <div class="hint" id="jotSummary"></div>
      <div id="jotIssues"></div>
      <div class="tablewrap" id="jotList" style="margin-top:12px"></div>
    </div>
    <aside class="card" id="jotDetail" hidden></aside>
  </div>
</main>

<div id="eventBackdrop" hidden></div>
<aside id="eventDrawer" role="dialog" aria-label="Event details" hidden></aside>
<script src="/dom.js"></script>
<script src="/grid.js"></script>
<script src="/recent.js"></script>
<script>
"use strict";

const PRESETS = [
  { label: "Latest events", chart: "table", title: "Latest events",
    sql: "SELECT pk, datetime(ts/1000, 'unixepoch', 'localtime') AS time, action, sensor, capture, call_site_name AS call_site, message\nFROM events ORDER BY ts DESC LIMIT 100" },
  { label: "Violations", chart: "table", title: "Violations, blocked and would-have-been-blocked",
    sql: "SELECT pk, datetime(ts/1000, 'unixepoch', 'localtime') AS time, action, sensor, capture, message, call_site_name AS call_site\nFROM events WHERE action IN ('blocked', 'monitored') ORDER BY ts DESC LIMIT 200" },
  { label: "Blocked", chart: "table", title: "Blocked calls",
    sql: "SELECT pk, datetime(ts/1000, 'unixepoch', 'localtime') AS time, sensor, capture, message, call_site_name AS call_site\nFROM events WHERE action = 'blocked' ORDER BY ts DESC LIMIT 200" },
  { label: "Events by sensor", chart: "bar", title: "Events by sensor",
    sql: "SELECT sensor || ' (' || action || ')' AS sensor, COUNT(*) AS events\nFROM events GROUP BY sensor, action ORDER BY events DESC" },
  { label: "Busiest call sites", chart: "bar", title: "Busiest call sites",
    sql: "SELECT call_site_name AS call_site, COUNT(*) AS events\nFROM events WHERE call_site_name IS NOT NULL GROUP BY call_site_name ORDER BY events DESC LIMIT 15" },
  { label: "Events per minute", chart: "line", title: "Events per minute",
    sql: "SELECT strftime('%H:%M', ts/1000, 'unixepoch', 'localtime') AS minute, COUNT(*) AS events\nFROM events GROUP BY minute ORDER BY MIN(ts)" },
];

const $ = (id) => document.getElementById(id);
let current = null;       // { title, explanation, sql, chart, question }
let busy = false;
let asked = [];           // questions asked, with the SQL the model wrote
let timer = null;
let currentPage = "events";

// ---- tiny DOM helper, see dom.js. Text is only ever added as text, captured values can be hostile.
const el = JotDom.makeEl(document);
const svgEl = (tag, attrs, text) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};

async function api(path, body, extraHeaders) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-JOT-Dashboard": "1", ...(extraHeaders || {}) },
    body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: "unreadable response" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function ago(ms) {
  if (!ms) return "never";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour12: false });

// ---- pages
function showPage(address) {
  const [name, selected] = (address || "").split("/");
  if (name === "event") {
    openEvent(selected);
  } else {
    closeEvent();
    if (selected) pendingSelect = decodeURIComponent(selected);
  }
  currentPage = name === "policy" ? "policy" : "events";
  $("eventsPage").hidden = currentPage !== "events";
  $("policyPage").hidden = currentPage !== "policy";
  $("navEvents").className = currentPage === "events" ? "active" : "";
  $("navPolicy").className = currentPage === "policy" ? "active" : "";
  if (currentPage === "policy") { refreshControl(); loadJots(); }
  setTimer();
}
window.addEventListener("hashchange", () => showPage(location.hash.slice(1)));

// ---- enforcement. Agents read a control file, nothing here reaches an agent.
let controlState = null;

async function changeControl(change, confirmText) {
  if (confirmText && !window.confirm(confirmText)) return;
  const token = $("adminToken").value.trim();
  if (!token) { showControlMessage("Type the admin token first."); $("adminToken").focus(); return; }
  try {
    drawControl(await api("/api/control", change, { "X-JOT-Admin": token }));
  } catch (e) { showControlMessage(e.message); }
}

function showControlMessage(text) {
  $("controlBody").prepend(el("div", { class: "error", text }));
}

function drawControl(c) {
  controlState = c;
  const pill = $("policyPill");
  $("enforcementCard").hidden = !c.enabled;
  pill.hidden = !c.enabled;
  if (!c.enabled) return;

  const total = c.rules.length;
  const blocking = c.rules.filter((r) => r.mode === "block").length;
  pill.className = !c.master ? "observe" : blocking === total ? "block" : "partial";
  pill.textContent = !c.master ? "Observe, nothing is blocked" : blocking + " of " + total + " rules blocking";

  $("enforceStatus").textContent = !c.master
    ? "Observe is on. Every rule reports what it would stop and stops nothing."
    : blocking === total ? "All " + total + " rules are blocking."
    : blocking + " of " + total + " rules are blocking. " + (total - blocking) + " report only.";

  $("modeObserve").className = c.master ? "" : "active observe";
  $("modeBlock").className = c.master ? "active block" : "";
  for (const id of ["modeObserve", "modeBlock"]) $(id).disabled = !c.writable;
  $("tokenBox").hidden = !c.writable;

  const rows = c.rules.map((r, index) => {
    const block = r.mode === "block";
    // what the rule is set to by itself, ignoring the master switch
    const intended = r.setting !== null ? r.setting : !r.staged;
    const changed = r.setting !== null && r.setting !== !r.staged;
    const sw = el("button", { type: "button", id: "ruleSwitch" + index, class: "switch", role: "switch", "aria-checked": String(intended),
      "aria-label": r.name + " blocks", disabled: !c.writable || !c.master ? "" : null,
      title: !c.master ? "Observe is on, so no rule blocks" : intended ? "Click to make this rule report only" : "Click to make this rule block",
      onclick: () => {
        const next = !intended;
        // switching back to what the .jot file says removes the override
        changeControl({ rules: { [r.name]: next === !r.staged ? null : next } },
          next ? null : "Make " + r.name + " report only? It will stop blocking.");
      } });
    return el("div", { class: "rule" },
      el("div", { class: "name" }, r.name, " ",
        el("span", { class: "badge " + (block ? "blocked" : "monitored"), text: block ? "blocking" : "report only" }),
        !c.master ? el("span", { class: "hint", style: "margin:0", text: "(Observe is on)" })
          : changed ? el("span", { class: "hint", style: "margin:0", text: "(changed here, the .jot file says " + (r.staged ? "report only" : "block") + ")" })
          : r.staged ? el("span", { class: "hint", style: "margin:0", text: "(staged as report only in its .jot file)" }) : null),
      el("div", { class: "sw" }, el("label", { for: "ruleSwitch" + index, text: "Block", style: "cursor:pointer" }), sw),
      el("div", { class: "why", text: (r.description ? r.description + ". " : "") + r.message }),
      el("div", { class: "counts", text: r.last_hour.blocked + " blocked, " + r.last_hour.monitored + " reported in the last hour" }));
  });
  const applied = c.applied.length
    ? el("div", { class: "applied" }, "Agents confirmed, latest first. " + c.applied.slice(0, 4).map((a) =>
        clock(a.ts) + " " + (a.app || "?") + " " + a.change).join(". "))
    : el("div", { class: "applied", text: c.file_exists
        ? "No agent has confirmed these settings yet. Agents need -Djot.control pointing at the control file."
        : "No control file yet. It is created the first time you change something." });
  $("controlBody").replaceChildren(
    ...(c.writable ? [] : [el("div", { class: "notice", text: "Read only. Start the dashboard with JOT_DASHBOARD_ADMIN_TOKEN to allow changes." })]),
    ...(rows.length ? rows : [el("div", { class: "empty", text: "No rules were found. A rule is a sensor that has an exception." })]),
    applied,
    el("div", { class: "applied", text: "An agent started with -Djot.enforce=false ignores these settings." }));
}

function setMode(master) {
  if (controlState && controlState.master === master) return;
  changeControl({ master }, master ? null : "Switch to Observe? Every rule will report only and nothing will be blocked.");
}
$("tokenShow").addEventListener("click", () => {
  const field = $("adminToken");
  const hide = field.type === "text";
  field.type = hide ? "password" : "text";
  $("tokenShow").textContent = hide ? "Show" : "Hide";
});
$("modeObserve").addEventListener("click", () => setMode(false));
$("modeBlock").addEventListener("click", () => setMode(true));

async function refreshControl() {
  try { drawControl(await api("/api/control")); } catch (e) { /* not available */ }
}

// ---- status
async function refreshStatus() {

    el("span", {}, el("b", { text: s.events.toLocaleString() }), " events"),

      text: s.filtered.toLocaleString() + " JDK and server events left out" }) : null,

// ---- rendering results
function isNumber(v) { return typeof v === "number" && isFinite(v); }

function cell(col, v) {
  if (v === null || v === undefined) return el("td", { class: "null", text: "—" });
  if ((col === "ts" || col.endsWith("_ts")) && isNumber(v)) return el("td", { text: new Date(v).toLocaleString() });
  if (col === "action" && typeof v === "string") return el("td", {}, el("span", { class: "badge " + v, text: v }));
  const s = String(v);
  const td = el("td", { class: isNumber(v) ? "num" : "", text: s.length > 300 ? s.slice(0, 300) + "…" : s });
  if (s.length > 300) td.title = s.slice(0, 2000);
  return td;
}

function tableView(r, hint) {
  if (!r.rows.length) return el("div", { class: "empty", text: hint || "No matching events" });
  // a column called pk makes each row open that event, and isn't shown itself
  const pkAt = r.columns.indexOf("pk");
  const shown = r.columns.map((c, i) => i).filter((i) => i !== pkAt);
  const head = el("tr", {}, ...shown.map((i) => el("th", { text: r.columns[i] })));
  const body = r.rows.map((row) => {
    const tr = el("tr", {}, ...shown.map((i) => cell(r.columns[i], row[i])));
    if (pkAt >= 0 && row[pkAt] != null) {
      const open = () => { location.hash = "#event/" + row[pkAt]; };
      tr.className = "clickable";
      tr.tabIndex = 0;
      tr.title = "Open this event";
      tr.addEventListener("click", (ev) => { if (!window.getSelection().toString()) open(); });
      tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter") open(); });
    }
    return tr;
  });
  return el("div", { class: "tablewrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...body)));
}

// A lone X is centered, real values are left aligned, and several are bulleted so each can be read on its own.
function gridCell(values) {
  if (!values.length) return el("td", { class: "off" });
  if (values.length === 1 && values[0] === "X") return el("td", { class: "on", text: "X" });
  if (values.length === 1) return el("td", { class: "on vals", text: values[0] });
  return el("td", { class: "on vals" }, el("ul", {}, ...values.map((v) => el("li", { text: v }))));
}

function gridView(r) {
  if (!r.rows.length) return el("div", { class: "empty", text: r.hint || "No matching events" });
  const g = JotGrid.pivot(r.columns, r.rows);
  const head = el("tr", {}, el("th", { text: g.corner }), ...g.columns.map((c) => el("th", { class: "col", text: c })));
  const body = g.rows.map((row) => el("tr", {},
    el("td", { class: "rowlabel", title: row.label, text: row.label }),
    ...row.cells.map(gridCell)));
  const wrap = el("div", { class: "tablewrap" }, el("table", { class: "grid" }, el("thead", {}, head), el("tbody", {}, ...body)));
  if (!g.hiddenColumns) return wrap;
  return el("div", {}, wrap, el("div", { class: "hint", text: g.hiddenColumns + " more columns are not shown" }));
}

function chartable(r) {
  return r.columns.length >= 2 && r.rows.length > 0 && r.rows.every((x) => isNumber(x[1]));
}

function barView(r) {
  const rows = r.rows.slice(0, 25);
  const max = Math.max(...rows.map((x) => x[1]), 1);
  const rowH = 26, labelW = 260, W = 900, barW = W - labelW - 70;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${rows.length * rowH + 4}`, width: "100%", role: "img",
                             "aria-label": "bar chart" });
  rows.forEach((x, i) => {
    const y = i * rowH + 2;
    const label = String(x[0] ?? "—");
    svg.append(svgEl("text", { x: labelW - 8, y: y + 17, "text-anchor": "end" }, label.length > 40 ? label.slice(0, 39) + "…" : label));
    const w = Math.max(2, (x[1] / max) * barW);
    svg.append(svgEl("rect", { x: labelW, y: y + 3, width: w, height: rowH - 8, rx: 3, fill: "var(--bar)" }));
    svg.append(svgEl("text", { x: labelW + w + 6, y: y + 17, class: "muted" }, x[1].toLocaleString()));
  });
  return svg;
}

function lineView(r) {
  const rows = r.rows;
  const W = 900, H = 260, L = 50, R = 20, T = 12, B = 34;
  const max = Math.max(...rows.map((x) => x[1]), 1);
  const px = (i) => L + (rows.length === 1 ? (W - L - R) / 2 : (i / (rows.length - 1)) * (W - L - R));
  const py = (v) => T + (1 - v / max) * (H - T - B);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "line chart" });
  [0, 0.5, 1].forEach((f) => {
    const y = py(max * f);
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--line)" }));
    svg.append(svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end", class: "muted" }, Math.round(max * f).toLocaleString()));
  });
  svg.append(svgEl("polyline", { points: rows.map((x, i) => `${px(i)},${py(x[1])}`).join(" "),
                                 fill: "none", stroke: "var(--bar)", "stroke-width": 2 }));
  rows.forEach((x, i) => {
    const dot = svgEl("circle", { cx: px(i), cy: py(x[1]), r: 3.5, fill: "var(--bar)" });
    dot.append(svgEl("title", {}, `${x[0]}: ${x[1]}`));
    svg.append(dot);
  });
  const ends = rows.length > 1 ? [0, rows.length - 1] : [0];
  ends.forEach((i, n) => svg.append(svgEl("text", { x: px(i), y: H - 10, "text-anchor": n ? "end" : "start", class: "muted" }, String(rows[i][0]))));
  return svg;
}

function show(entry, r) {
  current = entry;
  let chart = entry.chart;
  if (chart === "grid" && r.columns.length < 2) chart = "table";
  else if ((chart === "bar" || chart === "line") && !chartable(r)) chart = "table";
  const view = chart === "grid" ? gridView(r)
    : !r.rows.length ? tableView(r, r.hint)
    : chart === "bar" ? barView(r) : chart === "line" ? lineView(r) : tableView(r);

  const sqlBox = el("textarea", { spellcheck: "false", "aria-label": "SQL" });
  sqlBox.value = entry.sql;
  const chartSel = el("select", { "aria-label": "chart type" }, ...["table", "grid", "bar", "line"].map((c) => {
    const o = el("option", { value: c, text: c }); if (c === chart) o.selected = true; return o; }));
  chartSel.addEventListener("change", () => { current.chart = chartSel.value; show(current, r); });
  const run = el("button", { text: "Run SQL", onclick: () => runSql(sqlBox.value, current) });

  $("results").replaceChildren(el("div", { class: "card result" },
    el("h2", { text: entry.title || "Result" }),
    entry.explanation ? el("p", { class: "explain", text: entry.explanation }) : null,
    view,
    el("div", { class: "meta" },
      el("span", { text: r.rows.length.toLocaleString() + " rows" + (r.truncated ? " (limited, there are more)" : "") + " in " + r.ms + " ms" }),
      el("span", {}, "show as ", chartSel)),
    el("details", {}, el("summary", { text: "SQL" }), sqlBox, el("div", { class: "row" }, run))));
}

function showError(message) {
  $("results").replaceChildren(el("div", { class: "error", text: message }));
}

// ---- actions
async function runSql(sql, entry) {
  if (busy) return;
  busy = true;
  try {
    const r = await api("/api/sql", { sql, limit: entry.chart === "grid" ? 5000 : undefined });
    show({ ...entry, sql }, r);
  } catch (e) { showError(e.message); } finally { busy = false; }
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; $("askBtn").disabled = true; $("askBtn").textContent = "Thinking…";
  try {
    const r = await api("/api/ask", { question, history: asked.slice(-5) });
    const entry = { title: r.title, explanation: r.explanation, sql: r.sql, chart: r.chart, question };
    if (!r.sql) {
      $("results").replaceChildren(el("div", { class: "card" }, el("h2", { text: r.title }), el("p", { class: "explain", text: r.explanation })));
    } else {
      show(entry, r);
      // a question that found nothing isn't kept, it would only be clutter and wrong context for the next question
      remember({ question, sql: r.sql, title: r.title, chart: r.chart, explanation: r.explanation }, r.rows.length);
    }
  } catch (e) { showError(e.message); }
  finally { busy = false; $("askBtn").disabled = false; $("askBtn").textContent = "Ask"; }
}

// ---- recent questions, in the top menu. Only questions that returned something are kept.
function remember(item, rowCount) {
  asked = JotRecent.remember(asked, item, rowCount);
  try { localStorage.setItem("jot-history", JSON.stringify(asked)); } catch (e) { /* private mode */ }
  drawRecent();
}

function closeRecent() {
  $("recentList").hidden = true;
  $("recentBtn").setAttribute("aria-expanded", "false");
}

function drawRecent() {
  $("recentBtn").textContent = "Recent questions" + (asked.length ? " (" + asked.length + ")" : "") + " \u25BE";
  const items = asked.slice().reverse().map((h) => el("button", { type: "button", role: "menuitem", title: h.question + "\n\n" + h.sql, text: h.question,
    onclick: () => { closeRecent(); location.hash = "#events"; $("question").value = h.question; runSql(h.sql, h); } }));
  $("recentList").replaceChildren(...(items.length
    ? [...items, el("div", { class: "sep" }), el("button", { type: "button", class: "clear", text: "Clear this list", onclick: () => {
        asked = [];
        try { localStorage.setItem("jot-history", "[]"); } catch (e) { /* ignore */ }
        drawRecent();
      } })]
    : [el("div", { class: "none", text: "Questions you ask will be listed here, when they find something." })]));
}

$("recentBtn").addEventListener("click", (ev) => {
  ev.stopPropagation();
  const open = $("recentList").hidden;
  $("recentList").hidden = !open;
  $("recentBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", (ev) => { if (!$("recentMenu").contains(ev.target)) closeRecent(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeRecent(); });

// One pulldown for the built in views and for the reports defined in the .jot files
let reportItems = [];     // what each option runs, in the order of the options

function drawPicker(reports) {
  const select = $("reportSelect");
  const chosen = select.value;
  reportItems = [];
  const group = (label, items) => {
    const g = el("optgroup", { label });
    for (const item of items) {
      reportItems.push(item);
      g.append(el("option", { value: String(reportItems.length - 1), text: item.label || item.name }));
    }
    return g;
  };
  select.replaceChildren(el("option", { value: "", text: "Views and reports…" }), group("Views", PRESETS));
  if (reports.length) select.append(group("Reports from your .jot files", reports));
  select.value = chosen && reportItems[Number(chosen)] ? chosen : "";
}

async function drawReports() {
  try { drawPicker(await api("/api/reports")); } catch (e) { /* reports are optional */ }
}

// ---- sensors, rules and reports, read only. How each is defined and whether it fires.
let jots = null;
let jotSelected = null;       // "kind:name"
let pendingSelect = null;     // a name from the address, like #policy/get-routes, selected once the list has loaded

function selectJot(key, name) {
  jotSelected = key;
  $("policyGrid").classList.add("has-detail");
  $("jotDetail").hidden = false;
  try { history.replaceState(null, "", "#policy/" + encodeURIComponent(name)); } catch (e) { /* ignore */ }
  drawJots();
}

function closeDetail() {
  jotSelected = null;
  $("policyGrid").classList.remove("has-detail");
  $("jotDetail").hidden = true;
  try { history.replaceState(null, "", "#policy"); } catch (e) { /* ignore */ }
  drawJots();
}
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && jotSelected) closeDetail(); });

async function loadJots() {
  try { jots = await api("/api/jots"); drawJots(); } catch (e) { $("jotList").replaceChildren(el("div", { class: "error", text: e.message })); }
}

function jotItems() {
  const items = jots.sensors.map((s) => ({ ...s, key: s.kind + ":" + s.name, search:
    [s.name, s.description, s.file, ...s.methods, ...s.scopes].join(" ").toLowerCase() }));
  for (const r of jots.reports) {
    items.push({ ...r, kind: "report", key: "report:" + r.name, search: [r.name, r.type, r.rows, r.cols, r.file].join(" ").toLowerCase() });
  }
  return items;
}

// a name like javax.servlet.ServletRequest.isUserInRole may break after a dot, and nowhere else
function dotted(text) {
  const out = [];
  String(text || "").split(".").forEach((part, n, all) => {
    out.push(part + (n < all.length - 1 ? "." : ""));
    if (n < all.length - 1) out.push(document.createElement("wbr"));
  });
  return out;
}

function kindBadge(item) {
  if (item.kind === "report") return el("span", { class: "badge report", text: "report" });
  if (item.kind === "sensor") return el("span", { class: "badge sensor", text: "observe" });
  return el("span", { class: "badge " + (item.mode === "block" ? "blocked" : "monitored"), text: item.mode === "block" ? "rule, blocks" : "rule, reports" });
}

function drawJots() {
  if (!jots) return;
  const filter = $("jotFilter").value.trim().toLowerCase();
  const kind = $("jotKind").value;
  const all = jotItems();
  if (pendingSelect) {
    const wanted = all.find((i) => i.name === pendingSelect);
    pendingSelect = null;
    if (wanted) { jotSelected = wanted.key; $("policyGrid").classList.add("has-detail"); $("jotDetail").hidden = false; }
  }
  const shown = all.filter((i) => (!kind || i.kind === kind) && (!filter || i.search.includes(filter)));
  const rules = jots.sensors.filter((s) => s.kind === "rule").length;
  $("jotSummary").textContent = (jots.sensors.length - rules) + " sensors, " + rules + " rules and " + jots.reports.length
    + " reports from " + jots.files.length + " files" + (shown.length !== all.length ? ". Showing " + shown.length : "");

  const issues = jots.issues;
  $("jotIssues").replaceChildren(...(issues.length > 3
    ? [el("details", {}, el("summary", { class: "hint", text: issues.length + " things to look at" }), ...issues.map(issueRow))]
    : issues.map(issueRow)));

  const head = el("tr", {}, ...["Name", "Kind", "Watches or uses", "File", "Last hour", "Total", "Last fired"].map((t) => el("th", { text: t })));
  const body = shown.map((i) => {
    const watches = i.kind === "report"
      ? i.type + (i.rows ? ", " + i.rows + " by " : ", ") + (i.cols || "")
      : (i.methods[0] || "") + (i.methods.length > 1 ? " +" + (i.methods.length - 1) : "");
    const num = (v) => el("td", { class: "num", text: i.kind === "report" ? "" : String(v) });
    return el("tr", { class: i.key === jotSelected ? "selected" : "", onclick: () => selectJot(i.key, i.name) },
      el("td", { text: i.name }), el("td", {}, kindBadge(i)), el("td", {}, ...dotted(watches)), el("td", { text: i.file || "" }),
      num(i.last_hour), num(i.events),
      el("td", { class: i.kind !== "report" && !i.events ? "null" : "", text: i.kind === "report" ? "" : (i.events ? ago(i.last_ts) : "never") }));
  });
  $("jotList").replaceChildren(shown.length
    ? el("table", { class: "list" }, el("thead", {}, head), el("tbody", {}, ...body))
    : el("div", { class: "empty", text: "Nothing matches" }));
  const open = all.find((i) => i.key === jotSelected);
  if (open) drawJotDetail(open);
}

function issueRow(i) {
  return el("div", { class: "issue " + i.level, text: (i.file ? i.file + ": " : "") + i.text });
}

function listSection(title, values) {
  if (!values || !values.length) return null;
  return el("div", {}, el("h4", { text: title }), el("ul", {}, ...values.map((v) => el("li", { text: v }))));
}

function fact(value, label) {
  return el("div", { class: "fact" }, el("b", { text: String(value) }), el("span", { text: label }));
}

function drawJotDetail(i) {
  const d = $("jotDetail");
  const close = el("button", { type: "button", class: "close", "aria-label": "Close", title: "Close", text: "\u00d7", onclick: closeDetail });
  if (i.kind === "report") {
    d.replaceChildren(el("div", {},
      close, el("h2", { text: i.name }), kindBadge(i), " ", el("span", { class: "hint", text: i.file }),
      el("p", { class: "explain", text: i.type === "list"
        ? "One row per call site, with what " + i.cols + " captured there."
        : "Rows are the captures of " + i.rows + ". " + (i.type === "compare"
          ? "Columns come from the captures of " + i.cols + ", with an X where it was seen in the same request."
          : "One column for each of " + i.cols + ", showing what it captured in the same request.") }),
      listSection("Rows", i.rows ? [i.rows] : null), listSection(i.type === "table" ? "Columns" : "Column source", (i.cols || "").split(",").map((c) => c.trim()).filter(Boolean)),
      i.sql ? el("button", { class: "primary", text: "Open this report", onclick: () => { location.hash = "#events"; runSql(i.sql, { title: i.name, chart: "grid", sql: i.sql }); } }) : null));
    return;
  }
  const never = !i.events;
  d.replaceChildren(el("div", {},
    close, el("h2", { text: i.name }), kindBadge(i), " ", el("span", { class: "hint", text: i.file }),
    i.description ? el("p", { class: "explain", text: i.description }) : null,
    el("div", { class: "facts" }, fact(i.events, "events"), fact(i.last_hour, "last hour"), fact(i.events ? ago(i.last_ts) : "never", "last fired"),
      ...(i.kind === "rule" ? [fact(i.blocked, "blocked"), fact(i.monitored, "reported only")] : [])),
    never ? el("div", { class: "hint", text: "No events in the log yet. A sensor only records when the code it watches runs, so check the method names if you expected it." }) : null,
    i.kind === "rule" ? el("div", { class: "notice", text: (i.mode === "block" ? "Blocks the call. " : "Only reports, nothing is stopped. ") + "Message: " + i.exception }) : null,
    listSection("Watches", i.methods), listSection("Only inside", i.scopes), listSection("Skips", i.excludes),
    listSection("Captures", i.captures), listSection("Matchers", i.matchers),
    el("h4", { text: "As written" }), el("pre", { text: i.definition || "" }),
    el("div", { class: "row" }, el("button", { class: "primary", text: "Show its events", onclick: () => {
      location.hash = "#events";
      runSql("SELECT datetime(ts/1000, 'unixepoch', 'localtime') AS time, action, capture, call_site_name AS call_site, message\nFROM events WHERE sensor = '"
        + i.name.replace(/'/g, "''") + "' ORDER BY ts DESC LIMIT 200", { title: "Events from " + i.name, chart: "table" });
    } }))));
}

$("jotFilter").addEventListener("input", drawJots);
$("jotKind").addEventListener("change", drawJots);

// ---- keeping things current
function setTimer() {
  clearInterval(timer);
  const fast = currentPage === "events" && $("live").checked;
  timer = setInterval(tick, fast ? 3000 : 6000);
}

async function tick() {
  try {
    await Promise.all([refreshStatus(), refreshControl()]);
    if (currentPage === "policy") { await loadJots(); return; }
    // refresh the current view, unless someone is editing its SQL
    if ($("live").checked && current && !busy && !$("results").querySelector("details[open]")) {
      const r = await api("/api/sql", { sql: current.sql, limit: current.chart === "grid" ? 5000 : undefined });
      show(current, r);
    }
  } catch (e) { /* the server may be restarting, try again next tick */ }
}

$("live").addEventListener("change", (ev) => {
  try { localStorage.setItem("jot-live", ev.target.checked ? "1" : "0"); } catch (e) { /* ignore */ }
  setTimer();
});
$("askForm").addEventListener("submit", (ev) => { ev.preventDefault(); ask($("question").value); });
$("reportSelect").addEventListener("change", (ev) => {
  const item = reportItems[Number(ev.target.value)];
  if (ev.target.value !== "" && item) runSql(item.sql, item);
});

try { asked = JSON.parse(localStorage.getItem("jot-history") || "[]"); } catch (e) { asked = []; }
try { $("live").checked = localStorage.getItem("jot-live") !== "0"; } catch (e) { $("live").checked = true; }
drawPicker([]); drawReports(); drawRecent();
// ---- the event viewer. #event/<pk> opens it, so an event can be linked to.
let shownEvent = null;
let hideRuntime = false;

function closeEvent() {
  shownEvent = null;
  $("eventDrawer").hidden = true;
  $("eventBackdrop").hidden = true;
}

async function openEvent(pk) {
  if (!/^\d+$/.test(pk || "")) return closeEvent();
  try {
    const e = await api("/api/event?pk=" + pk);
    if (location.hash !== "#event/" + pk) return;   // moved on while it loaded
    shownEvent = e;
    drawEvent();
  } catch (err) {
    shownEvent = { error: err.message };
    $("eventDrawer").replaceChildren(el("button", { class: "small", text: "Close", onclick: () => { location.hash = "#events"; } }),
      el("div", { class: "error", text: err.message }));
    $("eventDrawer").hidden = false;
    $("eventBackdrop").hidden = false;
  }
}

function drawEvent() {
  const e = shownEvent;
  const fact = (k, v) => v === null || v === undefined || v === "" ? null : [el("dt", { text: k }), el("dd", { text: String(v) })];
  const facts = [
    fact("sensor", e.sensor), fact("action", e.action), fact("origin", e.origin), fact("application", e.app),
    fact("host", e.host), fact("process", e.pid), fact("run", e.run), fact("event", e.id), fact("trace", e.trace),
    fact("thread", e.thread_id != null ? e.thread + " (" + e.thread_id + ")" : e.thread), fact("method", e.method),
    fact("call site", e.call_site), fact("app frame", e.app_frame), fact("time (UTC)", e.time),
  ].filter(Boolean).flat();
  const frames = e.stack.filter((f) => !(hideRuntime && f.kind === "platform"));
  const hiddenCount = e.stack.length - frames.length;
  const when = e.ts ? new Date(e.ts).toLocaleString() + "." + String(e.ts % 1000).padStart(3, "0") : "";
  const copy = el("button", { class: "small", text: "Copy JSON", onclick: async (ev) => {
    const plain = { ...e, stack: e.stack.map((f) => f.frame), related: undefined };
    try { await navigator.clipboard.writeText(JSON.stringify(plain, null, 2)); ev.target.textContent = "Copied"; }
    catch (x) { ev.target.textContent = "Copy failed"; }
  } });
  // replaceChildren turns a null into the text "null", so empty sections are dropped first
  $("eventDrawer").replaceChildren(...[
    el("div", { class: "top" },
      e.action ? el("span", { class: "badge " + e.action, text: e.action }) : null,
      el("h2", { text: e.sensor || "event" }),
      el("span", { class: "spacer" }),
      copy,
      el("button", { class: "small", text: "Close", title: "Escape", onclick: () => { location.hash = "#events"; } })),
    el("div", { class: "when", text: when }),
    el("h4", { text: "Captured" }),
    el("pre", { class: "value", text: e.capture || "(nothing captured)" }),
    e.message ? el("h4", { text: "Message" }) : null,
    e.message ? el("pre", { class: "value", text: e.message }) : null,
    el("h4", { text: "Details" }),
    el("dl", {}, ...facts),
    el("h4", {}, "Stack (" + e.stack.length + " frames)",
      el("label", { class: "opt" },
        el("input", { type: "checkbox", checked: hideRuntime ? "" : null, onchange: (ev) => { hideRuntime = ev.target.checked; drawEvent(); } }),
        "hide JDK and server frames")),
    e.stack.length
      ? el("ol", { class: "frames", start: "0" }, ...frames.map((f) => el("li", { class: f.kind, title: f.kind },
          el("span", { class: "n", text: String(e.stack.indexOf(f)) }), el("span", { text: f.frame }))))
      : el("div", { class: "hint", text: "This event has no stack." }),
    hiddenCount ? el("div", { class: "hint", text: hiddenCount + " JDK and server frames hidden" }) : null,
    e.related.length > 1 ? el("h4", { text: "Same request (" + e.related.length + " events)" }) : null,
    e.related.length > 1 ? el("table", { class: "rel" }, el("tbody", {}, ...e.related.map(([pk, ts, action, sensor, capture]) => {
      const tr = el("tr", { class: pk === e.pk ? "here" : "", tabindex: "0" },
        el("td", { text: new Date(ts).toLocaleTimeString([], { hour12: false }) }),
        el("td", {}, el("span", { class: "badge " + action, text: action })),
        el("td", { text: sensor }),
        el("td", { text: (capture || "").length > 80 ? capture.slice(0, 80) + "…" : (capture || "") }));
      const go = () => { location.hash = "#event/" + pk; };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
      return tr;
    }))) : null,
  ].filter(Boolean));
  $("eventDrawer").hidden = false;
  $("eventBackdrop").hidden = false;
}
$("eventBackdrop").addEventListener("click", () => { location.hash = "#events"; });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && shownEvent) location.hash = "#events"; });

showPage(location.hash.slice(1));
runSql(PRESETS[0].sql, PRESETS[0]);
tick();
</script>
</body>
</html>
